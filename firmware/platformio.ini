[platformio]
default_envs = esp32dev

; Hardware variants (see include/board.h). A DevKit and a bare ESP-WROOM-32 run the same build;
; only the display and the main-PCB extras differ. Build/upload with scripts/device.ps1 -Env <name>.
[esp32_common]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@2.1.3
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@6.21.5
    adafruit/RTClib@2.1.4
    adafruit/Adafruit ST7735 and ST7789 Library@1.10.4
ili9488_lib_deps =
    ${esp32_common.lib_deps}
    moononournation/GFX Library for Arduino@1.4.9

; ESP32 DevKit / ESP-WROOM-32 + 1.8" ST7735 (the original build; esp32-st7735 is the same)
[env:esp32dev]
extends = esp32_common
build_flags = -D DISPLAY_ST7735

[env:esp32-st7735]
extends = env:esp32dev

; ESP32 DevKit / ESP-WROOM-32 + 3.5" ILI9488 SPI module, same wiring as the ST7735
[env:esp32-ili9488]
extends = esp32_common
lib_deps = ${esp32_common.ili9488_lib_deps}
build_flags = -D DISPLAY_ILI9488

; Main PCB (ESP32-WROOM-32E): 3.5" ILI9488 on J5, status LEDs, backlight switch, power and case inputs
[env:board-ili9488]
extends = esp32_common
lib_deps = ${esp32_common.ili9488_lib_deps}
build_flags = -D BOARD_MAIN -D DISPLAY_ILI9488


[env:nodemcu]
; Temporary NodeMCU ESP8266 (ESP-12E/F, 4 MB). Same server device ID and sensor; see docs/WIRING.md.
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
; Extra 16 KB IRAM heap; the TLS buffers prefer it, leaving normal RAM for the app.
build_flags = -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
lib_deps = ${esp32_common.lib_deps}
