[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit Fingerprint Sensor Library@2.1.3
    adafruit/Adafruit SSD1306@2.5.13
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.17.4
    bblanchon/ArduinoJson@6.21.5
    adafruit/RTClib@2.1.4


[env:nodemcu]
; Temporary NodeMCU ESP8266 (ESP-12E/F, 4 MB). Same server device ID and sensor; see docs/WIRING.md.
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
; Extra 16 KB IRAM heap; the TLS buffers prefer it, leaving normal RAM for the app.
build_flags = -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
lib_deps = ${env:esp32dev.lib_deps}
