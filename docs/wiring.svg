<rect width="1720" height="1240" fill="#edf3f7"/>
<text x="40" y="50" class="title">Office fingerprint attendance · wiring (ESP32 DevKit, 1.8″ TFT, DS3231, R307 touch)</text>
<text x="40" y="80" class="sub">Left: what connects to what. Right: where those pins are on your board. Always match the printed labels, not wire colours or positions.</text>

<!-- ===== Left-side parts ===== -->
<rect x="40" y="130" width="270" height="120" rx="12" class="box"/>
<text x="60" y="164" class="head">5 V USB phone charger</text>
<text x="60" y="191" class="body">1 A or more · micro-USB cable</text>
<text x="60" y="216" class="small">Powers the board, and the R307</text>
<text x="60" y="234" class="small">through the VIN pin</text>
<path d="M310 190H380" class="wire red"/><text x="318" y="180" class="small">USB 5 V</text>

<rect x="40" y="300" width="270" height="150" rx="12" class="box"/>
<text x="60" y="334" class="head">Attendance server</text>
<text x="60" y="360" class="body">attendance.shahinanalytics.com</text>
<text x="60" y="385" class="small">HTTPS · scans sent instantly</text>
<text x="60" y="405" class="small">Office Wi-Fi (set in admin panel), or</text>
<text x="60" y="425" class="small">fallback phone hotspot</text>
<path d="M380 375H314" class="wire purple" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="322" y="358" class="small">Wi-Fi</text>

<rect x="40" y="600" width="270" height="130" rx="12" class="box"/>
<text x="60" y="634" class="head">IN / OUT button</text>
<text x="60" y="660" class="body">Optional · normally open</text>
<text x="60" y="684" class="small">Manual IN/OUT when no shift is set;</text>
<text x="60" y="702" class="small">also cancels an enrollment</text>
<path d="M310 640H380" class="wire purple"/><path d="M310 680H380" class="wire black"/>

