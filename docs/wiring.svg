<circle cx="1268" cy="520" r="5" class="cidle"/><text x="1282" y="525" class="loc">D32</text>
<circle cx="1268" cy="547" r="5" class="cidle"/><text x="1282" y="552" class="loc">D33</text>
<circle cx="1268" cy="574" r="7.5" class="cpurple"/><text x="1282" y="579" class="locused">D25</text>
