<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1240" viewBox="0 0 1720 1240" role="img" aria-labelledby="title desc">
<title id="title">ESP32 DevKit fingerprint attendance wiring with TFT, DS3231 and R307 touch wire</title>
<desc id="desc">30-pin ESP32 DevKit powered by a USB phone charger. 1.8 inch ST7735 TFT on SPI: SCK D18, SDA D23, A0 D4, RESET D19, CS D5, VCC and LED on 3V3. DS3231 clock on I2C D21 and D22 at 3.3 V. R307 on VIN, GND, RX2 and TX2, its touch output on D27 and touch power on 3V3. Optional button on D25. Left: functional wiring. Right: pin positions on the printed board.</desc>
