<!-- callouts -->
<path d="M1240 574H1258" class="wire purple"/><text x="1234" y="579" class="call" text-anchor="end" style="fill:#8058a0">IN/OUT button</text>
<path d="M1240 736H1258" class="wire black"/><text x="1234" y="741" class="call" text-anchor="end">R307 GND + button GND</text>
<path d="M1240 763H1258" class="wire red"/><text x="1234" y="768" class="call" text-anchor="end" style="fill:#c83b48">R307 VCC (5 V)</text>
<path d="M1482 412H1500" class="wire blue"/><text x="1506" y="417" class="call" style="fill:#207cba">OLED SCL</text>
