<!-- ===== Notes ===== -->
<rect x="40" y="1040" width="530" height="180" rx="12" fill="#fff5df" stroke="#c18a2e" stroke-width="2"/>
<text x="60" y="1072" class="head">Power: check before plugging in</text>
<text x="60" y="1100" class="body">• Power from a 5 V USB phone charger (1 A or more).</text>
<text x="60" y="1124" class="body">• Don't use the HW-131 / MB102 breadboard supply.</text>
<text x="60" y="1148" class="body">• Never 5 V on 3V3. Never PC USB and external 5 V together.</text>
<text x="60" y="1172" class="body">• 3V3 and GND each feed several wires: use a small rail</text>
<text x="60" y="1196" class="body">  or terminal block, not stacked jumper wires.</text>

<rect x="590" y="1040" width="530" height="180" rx="12" class="box"/>
<text x="610" y="1072" class="head">Parts</text>
<text x="610" y="1100" class="body">• TFT replaces the OLED; D21/D22 now carry the DS3231.</text>
<text x="610" y="1124" class="body">• DS3231 on 3.3 V (not 5 V) so it won't try to charge a CR2032.</text>
<text x="610" y="1148" class="body">• R307 Touch → D27 turns the sensor light off when idle.</text>
<text x="610" y="1172" class="body">• Sensor not detected? Swap the two R307 data wires.</text>
<text x="610" y="1196" class="body">• Join every ground: charger, ESP32, TFT, DS3231, R307.</text>

<rect x="1140" y="1040" width="540" height="180" rx="12" class="box"/>
<text x="1160" y="1072" class="head">Network</text>
<text x="1160" y="1100" class="body">• Office Wi-Fi: admin panel → Scanner &amp; Wi-Fi.</text>
<text x="1160" y="1124" class="body">• Fallback hotspot: see WIFI-CREDENTIALS.local.txt.</text>
<text x="1160" y="1148" class="body">• 2.4 GHz only. Keep near the router (now about −77 dBm).</text>
<text x="1160" y="1172" class="body">• Offline scans are saved on the board and sent later,</text>
<text x="1160" y="1196" class="body">  with correct times from the DS3231.</text>
</svg>
