<path d="M1482 736H1500" class="wire black"/><text x="1506" y="741" class="call">OLED GND</text>
<path d="M1482 763H1500" class="wire orange"/><text x="1506" y="768" class="call" style="fill:#d9822b">OLED VCC</text>

<!-- ===== Notes ===== -->
<rect x="40" y="860" width="520" height="160" rx="12" fill="#fff5df" stroke="#c18a2e" stroke-width="2"/>
<text x="60" y="892" class="head">Power: check before plugging in</text>
<text x="60" y="920" class="body">• Power from a 5 V USB phone charger (1 A or more).</text>
<text x="60" y="944" class="body">• Don't use the HW-131 / MB102 breadboard supply (overheats).</text>
<text x="60" y="968" class="body">• Buck converter: set 5.0 V and check + polarity with a meter.</text>
<text x="60" y="992" class="body">• Never 5 V on 3V3. Never PC USB and external 5 V together.</text>

<rect x="580" y="860" width="520" height="160" rx="12" class="box"/>
<text x="600" y="892" class="head">Signals</text>
<text x="600" y="920" class="body">• R307 TX → RX2 (GPIO16) · R307 RX ← TX2 (GPIO17).</text>
<text x="600" y="944" class="body">• Sensor not detected? Swap the two R307 data wires.</text>
<text x="600" y="968" class="body">• OLED pin order varies by maker: match its printed labels.</text>
<text x="600" y="992" class="body">• Join every ground: charger, ESP32, R307, OLED, button.</text>

<rect x="1120" y="860" width="520" height="160" rx="12" class="box"/>
<text x="1140" y="892" class="head">Network</text>
<text x="1140" y="920" class="body">• Office Wi-Fi: admin panel → Scanner &amp; Wi-Fi.</text>
<text x="1140" y="944" class="body">• Fallback hotspot: see WIFI-CREDENTIALS.local.txt.</text>
<text x="1140" y="968" class="body">• 2.4 GHz only. Keep near the router (now about −77 dBm).</text>
<text x="1140" y="992" class="body">• Offline scans are saved on the board and sent later.</text>
</svg>
