<circle cx="1268" cy="736" r="7.5" class="cblack" stroke="#ffffff" stroke-width="1.5"/><text x="1282" y="741" class="locused">GND</text>
<circle cx="1268" cy="763" r="7.5" class="cred"/><text x="1282" y="768" class="locused">VIN</text>
</g>
<!-- right header, top to bottom: D23 D22 TX0 RX0 D21 D19 D18 D5 TX2 RX2 D4 D2 D15 GND 3V3 -->
<g>
<circle cx="1472" cy="385" r="5" class="cidle"/><text x="1458" y="390" class="loc" text-anchor="end">D23</text>
<circle cx="1472" cy="412" r="7.5" class="cblue"/><text x="1458" y="417" class="locused" text-anchor="end">D22</text>
<circle cx="1472" cy="439" r="5" class="cidle"/><text x="1458" y="444" class="loc" text-anchor="end">TX0</text>
<circle cx="1472" cy="466" r="5" class="cidle"/><text x="1458" y="471" class="loc" text-anchor="end">RX0</text>
<circle cx="1472" cy="493" r="7.5" class="cgreen"/><text x="1458" y="498" class="locused" text-anchor="end">D21</text>
<circle cx="1472" cy="520" r="5" class="cidle"/><text x="1458" y="525" class="loc" text-anchor="end">D19</text>
