<circle cx="1472" cy="709" r="5" class="cidle"/><text x="1458" y="714" class="loc" text-anchor="end">D15</text>
<circle cx="1472" cy="736" r="7.5" class="cblack" stroke="#ffffff" stroke-width="1.5"/><text x="1458" y="741" class="locused" text-anchor="end">GND</text>
<circle cx="1472" cy="763" r="7.5" class="corange"/><text x="1458" y="768" class="locused" text-anchor="end">3V3</text>
